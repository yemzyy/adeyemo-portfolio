# Decap CMS configuration for the YEMZYY portfolio.
#
# IMPORTANT — before this works, replace "YOUR_GITHUB_USERNAME/YOUR_REPO_NAME"
# below with your actual GitHub repo, e.g. "adeyemodavid/yemzyy-portfolio".

backend:
  name: github
  repo: yemzyy/adeyemo-portfolio
  branch: main

# Where files you upload through the CMS (e.g. review-related images, if any)
# get stored in the repo.
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "pricing"
    label: "Pricing"
    files:
      - file: "assets/data/pricing.json"
        label: "Service Pricing"
        name: "pricing"
        fields:
          - label: "Graphic Design Packages"
            name: "design"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Price (number only, e.g. 30)", name: "price", widget: "number", value_type: "int" }
              - { label: "Unit (e.g. /hr — leave blank if none)", name: "unit", widget: "string", required: false }
              - { label: "Description", name: "desc", widget: "text" }
          - label: "Video Editing Packages"
            name: "video"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Price (number only, e.g. 35)", name: "price", widget: "number", value_type: "int" }
              - { label: "Unit (e.g. /hr — leave blank if none)", name: "unit", widget: "string", required: false }
              - { label: "Description", name: "desc", widget: "text" }

  - name: "stats"
    label: "Statistics"
    files:
      - file: "assets/data/stats.json"
        label: "Homepage Stats"
        name: "stats"
        fields:
          - label: "Stats"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Value (number only)", name: "value", widget: "number", value_type: "int" }
              - { label: "Suffix (e.g. +, %)", name: "suffix", widget: "string" }

  - name: "reviews"
    label: "Reviews"
    files:
      - file: "assets/data/reviews.json"
        label: "Client Reviews"
        name: "reviews"
        fields:
          - label: "Reviews"
            name: "reviews"
            widget: "list"
            summary: "{{fields.name}} — {{fields.approved}}"
            fields:
              - { label: "Client Name", name: "name", widget: "string" }
              - { label: "Role / Company (optional)", name: "role", widget: "string", required: false }
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Approved (show publicly?)", name: "approved", widget: "boolean", default: false }

  - name: "design_projects"
    label: "Graphic Design Portfolio"
    files:
      - file: "assets/data/design.json"
        label: "Design Projects"
        name: "design"
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            summary: "{{fields.title}} — {{fields.category}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Category (type to match an existing one, or create a new one)", name: "category", widget: "string" }
              - { label: "Design Image", name: "image", widget: "image" }
              - { label: "Show as Recent?", name: "recent", widget: "boolean", default: false }

  - name: "video_projects"
    label: "Video Editing Portfolio"
    files:
      - file: "assets/data/video.json"
        label: "Video Projects"
        name: "video"
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            summary: "{{fields.title}} — {{fields.category}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Upload Video File (use this OR the URL field below, not both)", name: "videoFile", widget: "file", required: false }
              - { label: "OR: Video URL (e.g. a hosted .mp4 link)", name: "videoUrl", widget: "string", required: false }
              - { label: "Resolution (optional, e.g. 1920x1080)", name: "resolution", widget: "string", required: false }
              - { label: "Show as Recent?", name: "recent", widget: "boolean", default: false }

  - name: "vlog_projects"
    label: "Vlog Portfolio"
    files:
      - file: "assets/data/vlog.json"
        label: "Vlog Projects"
        name: "vlog"
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Category", name: "category", widget: "string", default: "Vlog" }
              - { label: "Upload Video File (use this OR the URL field below, not both)", name: "videoFile", widget: "file", required: false }
              - { label: "OR: Video URL", name: "videoUrl", widget: "string", required: false }
              - { label: "Resolution (e.g. 1920x1080)", name: "resolution", widget: "string", required: false }
              - { label: "Aspect Ratio", name: "aspectRatio", widget: "select", options: ["16/9", "4/3", "9/16", "1/1"] }
              - { label: "Show as Recent?", name: "recent", widget: "boolean", default: false }

# ---------------------------------------------------------------------------
# All portfolio content (Design, Video, Vlog, Pricing, Statistics, Reviews)
# is now managed above. Adding/editing/deleting a project here updates
# assets/data/*.json in your GitHub repo, which the live site reads
# directly — no code changes needed for everyday updates.
# ---------------------------------------------------------------------------
