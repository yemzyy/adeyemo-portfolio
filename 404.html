<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — YEMZYY</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .notfound { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; position: relative; z-index: 1; }
  .notfound img { width: 56px; height: 56px; object-fit: contain; margin-bottom: 1.5rem; opacity: 0.85; }
  .notfound-code { font-family: var(--font-mono); color: var(--accent-2); letter-spacing: 0.1em; margin-bottom: 0.5rem; }
  .notfound h1 { max-width: 560px; margin-bottom: 1rem; }
  .notfound p { color: var(--text-muted); max-width: 420px; margin-bottom: 2rem; }
</style>
</head>
<body>
<canvas id="plasmaCanvas" class="plasma-canvas" aria-hidden="true"></canvas>
<div class="notfound">
  <img src="assets/logo.png" alt="YEMZYY logo">
  <p class="notfound-code">ERROR 404</p>
  <h1>Looks like this project got lost.</h1>
  <p>The page you're looking for doesn't exist — but the rest of the portfolio is right where you left it.</p>
  <a href="index.html" class="btn btn-primary"><span>Back to the Portfolio</span></a>
</div>
<script>
  // Minimal plasma background only — full script.js isn't needed on this simple page.
  (function () {
    var canvas = document.getElementById("plasmaCanvas");
    var ctx = canvas.getContext("2d");
    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var w, h, dpr;
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      w = canvas.width = window.innerWidth * dpr;
      h = canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
    }
    resize();
    window.addEventListener("resize", resize);
    var blobs = [
      { color: "124,92,255", rx: 0.3, ry: 0.34, speed: 0.00075, phase: 0 },
      { color: "255,107,69", rx: 0.26, ry: 0.24, speed: 0.0006, phase: 2 },
      { color: "56,217,196", rx: 0.28, ry: 0.32, speed: 0.00055, phase: 6 },
    ];
    function draw(t) {
      ctx.clearRect(0, 0, w, h);
      ctx.globalCompositeOperation = "lighter";
      blobs.forEach(function (b) {
        var cx = w / 2 + Math.sin(t * b.speed + b.phase) * w * b.rx;
        var cy = h / 2 + Math.cos(t * b.speed * 1.3 + b.phase) * h * b.ry;
        var radius = Math.min(w, h) * 0.4;
        var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
        grad.addColorStop(0, "rgba(" + b.color + ",0.28)");
        grad.addColorStop(1, "rgba(" + b.color + ",0)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalCompositeOperation = "source-over";
    }
    if (reduceMotion) { draw(0); }
    else { (function loop(t) { draw(t); requestAnimationFrame(loop); })(0); }
  })();
</script>
</body>
</html>
